name = "1anniversary"
main = "worker/index.ts"
compatibility_date = "2026-09-11"

[vars]
ENVIRONMENT = "production"
# Set ALLOWED_ORIGIN in the deployment environment to the exact Pages origin.
# Example: https://1anniversary.pages.dev
ALLOWED_ORIGIN = "https://1anniversary.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "1anniversary"
database_id = "2065718c-46e5-4004-8acb-e0e7ece5b970"


[observability]
enabled = true

[triggers]
crons = ["0 17 * * *"]
